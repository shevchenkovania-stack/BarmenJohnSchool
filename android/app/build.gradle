plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// ── Ключ подписи релиза ─────────────────────────────────────────────────────
// Файл android/key.properties не хранится в репозитории. Образец лежит рядом:
// android/key.properties.example.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

// null, если файла нет или в нём не хватает полей.
def _releaseKeystore = keystorePropertiesFile.exists() &&
        keystoreProperties['storeFile'] &&
        keystoreProperties['storePassword'] &&
        keystoreProperties['keyAlias'] &&
        keystoreProperties['keyPassword']
        ? keystoreProperties
        : null

android {
    namespace = "com.shevchenkovania.bartenderschool"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // Уникальный идентификатор приложения: после первой публикации в
        // Google Play менять его нельзя — это будет другое приложение.
        applicationId = "com.shevchenkovania.bartenderschool"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = flutter.minSdkVersion
        targetSdk = flutter.targetSdkVersion
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            // Релиз подписывается секретом из android/key.properties
            // (см. android/key.properties.example). Пока файла нет —
            // собираем на debug-ключе, чтобы `flutter run --release`
            // продолжал работать на машине без секретов.
            signingConfig = _releaseKeystore != null
                ? signingConfigs.release
                : signingConfigs.debug
        }
    }
}

if (_releaseKeystore != null) {
    android.signingConfigs {
        release {
            storeFile file(_releaseKeystore['storeFile'])
            storePassword _releaseKeystore['storePassword']
            keyAlias _releaseKeystore['keyAlias']
            keyPassword _releaseKeystore['keyPassword']
        }
    }
}

flutter {
    source = "../.."
}
